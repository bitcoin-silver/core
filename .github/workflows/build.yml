name: Build

on:
  push:
    branches: [main]
    tags: ['version*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    name: Linux build + tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libevent-dev libboost-dev libsqlite3-dev libzmq3-dev \
            qt6-base-dev qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools libgl-dev \
            libqrencode-dev

      - name: Configure
        run: |
          cmake -B build \
            -DBUILD_TESTS=ON -DBUILD_BENCH=OFF -DBUILD_GUI=ON \
            -DENABLE_WALLET=ON -DENABLE_IPC=OFF

      - name: Build
        run: |
          cmake --build build -j"$(nproc)" \
            --target bitcoind bitcoin-cli bitcoin bitcoin-qt test_bitcoin

      - name: Run unit tests
        run: ./build/bin/test_bitcoinsilver

      - name: Verify mainnet genesis
        run: |
          set -e
          datadir="$(mktemp -d)"
          ./build/bin/bitcoinsilverd -datadir="$datadir" -connect=0 -listen=0 -daemon -printtoconsole=0
          sleep 5
          hash="$(./build/bin/bitcoinsilver-cli -datadir="$datadir" getblockchaininfo | grep bestblockhash | grep -o '[0-9a-f]\{64\}')"
          ./build/bin/bitcoinsilver-cli -datadir="$datadir" stop
          echo "Genesis hash: $hash"
          test "$hash" = "00000ea8e97e04892a03df35947ff0c4df705723f5b18be7cc6456ed16e9788e"

      - name: Package
        run: |
          set -e
          version="$(grep -oP 'CLIENT_VERSION_MAJOR \K[0-9]+' CMakeLists.txt).$(grep -oP 'CLIENT_VERSION_MINOR \K[0-9]+' CMakeLists.txt).$(grep -oP 'CLIENT_VERSION_BUILD \K[0-9]+' CMakeLists.txt)"
          name="bitcoinsilver-${version}-x86_64-linux-gnu"
          mkdir -p "dist/${name}/bin"
          cp build/bin/bitcoinsilverd build/bin/bitcoinsilver-cli build/bin/bitcoinsilver build/bin/bitcoinsilver-qt "dist/${name}/bin/"
          strip "dist/${name}/bin/"*
          cp COPYING README.md "dist/${name}/"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: dist/*.tar.gz

  windows:
    name: Windows cross-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config python3 \
            g++-mingw-w64-x86-64-posix gcc-mingw-w64-x86-64-posix \
            binutils-mingw-w64-x86-64 mingw-w64-x86-64-dev mingw-w64-common \
            curl git ca-certificates

      - name: Cache depends build
        uses: actions/cache@v4
        with:
          path: |
            depends/built
            depends/x86_64-w64-mingw32
            depends/sources
          key: depends-mingw32-${{ hashFiles('depends/packages/*.mk', 'depends/funcs.mk', 'depends/Makefile') }}

      - name: Build depends (Qt6, Boost, libevent, sqlite, zeromq for mingw)
        run: make -C depends HOST=x86_64-w64-mingw32 -j"$(nproc)"

      - name: Configure
        run: |
          cmake -B build-win64 \
            --toolchain depends/x86_64-w64-mingw32/toolchain.cmake \
            -DBUILD_GUI=ON -DBUILD_TESTS=OFF -DBUILD_BENCH=OFF -DENABLE_WALLET=ON

      - name: Build
        run: |
          cmake --build build-win64 -j"$(nproc)" \
            --target bitcoind bitcoin-cli bitcoin bitcoin-qt

      - name: Package
        run: |
          set -e
          version="$(grep -oP 'CLIENT_VERSION_MAJOR \K[0-9]+' CMakeLists.txt).$(grep -oP 'CLIENT_VERSION_MINOR \K[0-9]+' CMakeLists.txt).$(grep -oP 'CLIENT_VERSION_BUILD \K[0-9]+' CMakeLists.txt)"
          name="bitcoinsilver-${version}-win64"
          mkdir -p "dist/${name}"
          cp build-win64/bin/*.exe "dist/${name}/"
          x86_64-w64-mingw32-strip "dist/${name}/"*.exe
          cp COPYING README.md "dist/${name}/"
          (cd dist && zip -rq "${name}.zip" "${name}")

      - uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: dist/*.zip

  macos:
    name: macOS build + tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # doc/dependencies.md requires Clang 17.0+; macos-14's default Xcode
      # (15.4) ships AppleClang 15.0, which is too old and fails to compile
      # real, unmodified upstream code (util::Overloaded's C++20 aggregate
      # CTAD) -- confirmed by this job's first real run. Xcode 16.2 is
      # already present on this runner image, just not selected by default.
      - name: Select Xcode 16.2 (need Clang 17+, default Xcode 15.4 is too old)
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Install dependencies
        run: brew install cmake boost pkgconf libevent qt@6 qrencode

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)" \
            -DBUILD_TESTS=ON -DBUILD_BENCH=OFF -DBUILD_GUI=ON \
            -DENABLE_WALLET=ON -DENABLE_IPC=OFF

      - name: Build
        run: |
          cmake --build build -j"$(sysctl -n hw.ncpu)" \
            --target bitcoind bitcoin-cli bitcoin bitcoin-qt test_bitcoin

      - name: Run unit tests
        run: ./build/bin/test_bitcoinsilver

      - name: Verify mainnet genesis
        run: |
          set -e
          datadir="$(mktemp -d)"
          ./build/bin/bitcoinsilverd -datadir="$datadir" -connect=0 -listen=0 -daemon -printtoconsole=0
          sleep 5
          hash="$(./build/bin/bitcoinsilver-cli -datadir="$datadir" getblockchaininfo | grep bestblockhash | grep -o '[0-9a-f]\{64\}')"
          ./build/bin/bitcoinsilver-cli -datadir="$datadir" stop
          echo "Genesis hash: $hash"
          test "$hash" = "00000ea8e97e04892a03df35947ff0c4df705723f5b18be7cc6456ed16e9788e"

      # Note: macOS ships BSD grep, which has no -P (PCRE) support -- unlike
      # the Linux/Windows jobs' version-extraction, this stays POSIX-ERE-only.
      #
      # bitcoin-qt is intentionally NOT packaged here: it's dynamically linked
      # against Homebrew's Qt6 at this runner's absolute path
      # (/opt/homebrew/opt/qt6/...), which won't exist on an end user's Mac.
      # Making it portable needs `cmake --build build --target deploy`
      # (macdeployqtplus bundling Qt's frameworks into a real .app) -- left
      # for a follow-up. The GUI target is still built above, just to confirm
      # it compiles cleanly on macOS; only the CLI binaries ship here.
      - name: Package
        run: |
          set -e
          major="$(grep -oE 'CLIENT_VERSION_MAJOR [0-9]+' CMakeLists.txt | grep -oE '[0-9]+')"
          minor="$(grep -oE 'CLIENT_VERSION_MINOR [0-9]+' CMakeLists.txt | grep -oE '[0-9]+')"
          build="$(grep -oE 'CLIENT_VERSION_BUILD [0-9]+' CMakeLists.txt | grep -oE '[0-9]+')"
          version="${major}.${minor}.${build}"
          name="bitcoinsilver-${version}-arm64-apple-darwin"
          mkdir -p "dist/${name}/bin"
          cp build/bin/bitcoinsilverd build/bin/bitcoinsilver-cli build/bin/bitcoinsilver "dist/${name}/bin/"
          strip "dist/${name}/bin/"*
          cp COPYING README.md "dist/${name}/"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: dist/*.tar.gz

  release:
    name: Create GitHub Release
    needs: [linux, windows, macos]
    if: startsWith(github.ref, 'refs/tags/version')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
